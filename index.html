<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>
Hearing Loss Simulator
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<h1>
Hearing Loss Simulator
</h1>

<input
type="file"
id="audioFile"
accept=".wav">

<button id="loadButton">

Load Audio

</button>

<hr>

<div id="status">

No audio loaded.

</div>

<br>

<button
id="playButton"
disabled>

Play

</button>

<button
id="stopButton"
disabled>

Stop

</button>

<script
type="module"
src="js/app.js">
</script>

</body>

</html>
