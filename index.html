<!DOCTYPE html>
<html lang="en">

<head>
  
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">
  
<title>
Hearing Loss Simulator
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<h1>
Hearing Loss Simulator
</h1>

<h2>Audio Source</h2>

<label>
<input
type="radio"
name="source"
value="sample"
checked>

Built-in sample
</label>

<select id="sampleSelect">

<option value="audio/German_Examples.wav">
German word examples
</option>

<option value="audio/glasswater.wav">
Bottle and water
</option>
  
<option value="audio/hallelujah.wav">
Hallelujah - Leonard Cohen
</option>

<option value="audio/Sunday_someday.wav">
Sunday versus someday
</option>

</select>

<br><br>

<label>
<input
type="radio"
name="source"
value="upload">

Upload WAV
</label>

<input
type="file"
id="audioFile"
accept=".wav">

<br><br>

<select id="noiseSelect">
<option value="fan">Fan</option>
<option value="traffic">Distant traffic</option>
</select>

<button id="noiseButton">
Add background noise
</button>

  
<button id="loadButton">
Load Audio
</button>

  
<hr>

<h2>Audiogram</h2>

<div id="audiogram"></div>
<canvas id="audiogramCanvas" width="800" height="400"></canvas>
<h2>Spectrograms</h2>

<div class="spectrogram-container">

<div>
<h3>Acoustic Signal</h3>
<canvas id="originalSpectrogram"></canvas>
</div>

<div>
<h3>Hearing Loss</h3>
<canvas id="lossSpectrogram"></canvas>
</div>
  
<div>
<h3>Difference (Acoustic Signal - Hearing Loss)</h3>
<canvas id="differenceSpectrogram"></canvas>  
</div>
  
</div>
  
<div id="status"></div>

<br>

<div id="audiogram"></div>

<button id="playButton" disabled>
Play
</button>

<button id="stopButton" disabled>
Stop
</button>


<button id="processButton">
Apply Hearing Loss
</button>


<script
type="module"
src="js/app.js">
</script>

</body>
</html>
