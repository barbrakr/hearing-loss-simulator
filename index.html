<!DOCTYPE html>
<html lang="en">

<head>
  
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<script
    type="module"
    src="js/app.js">
</script>

  
<div id="language-select">
    <img src="language/us-flag.png" alt="American English" onclick="selectLanguage('en')">
    <img src="language/german-flag.png" alt="Deutsch" onclick="selectLanguage('de')">
</div>

/<a href="https://www.flaticon.com/free-icons/germany" title="germany icons">Germany icons created by Magnific - Flaticon</a>
/<a href="https://www.flaticon.com/free-icons/flag" title="flag icons">Flag icons created by Magnific - Flaticon</a>
  
<title data-i18n="title"></title>
  
<link
rel="stylesheet"
href="style.css">

</head>

<body>
  
<h1 data-i18n="title"></h1>
  
<h2 data-i18n="about"></h2>






<p data-i18n="about_text1" data-i18n-html></p>
<p data-i18n="about_text2" data-i18n-html></p>
<p data-i18n="about_text3"></p>
<p data-i18n="about_text4"></p>
<p>

</p>

<hr>
  
<h2 audio data-i18n="audio"></h2>

<label>
<input
type="radio"
name="source"
value="sample"
checked data-i18n="sample"
</label>

<select id="sampleSelect">

<option value="audio/freesound_community-4-year-old-counting-to-10-94902.wav"><p data-i18n="sample1"></p>
</option>

<option value="audio/faespencer-i-shouldnx27t-have-to-pick-up-my-toys-childspoken-204923.wav"><p data-i18n="sample2"></p>
</option>

<option value="audio/freesound_community-what-is-it-like-to-be-a-crocodile-27706.wav"><p data-i18n="sample3"></p>
</option>

<option value="audio/Sunday_someday.wav"><p data-i18n="sample4"></p>
</option>
  
<option value="audio/German_Examples.wav"><p data-i18n="sample5"></p>
</option>
  
<option value="audio/glasswater.wav"><p data-i18n="sample6"></p>
</option>

</select>

<br><br>

<label>
<input
type="radio"
name="source"
value="upload">

Upload WAV
</label>

<input
type="file"
id="audioFile"
accept=".wav">

<br><br>

<select id="noiseSelect">
<option value="fan">Fan</option>
<option value="music">Music</option>
<option value="restaurant">Restaurant chatter</option>
<option value="traffic">Distant traffic</option>

</select>

<button id="noiseButton">
Add background noise
</button>

<select id="foregroundSelect">
<option value="Tinnitus (ringing)">Tinnitus (ringing)</option>
<option value="Tinnitus (pulse)">Tinnitus (pulse)</option>
  
</select>
  
<button id="foregroundButton">
Add foreground noise
</button>

  
<button id="loadButton">
Load Audio (re-load also when exploring a new condition)
</button>

<p>

</p>
  
<hr>

<h2 data-i18n="audiogram"></h2>

<div id="audiogram"></div>
<canvas id="audiogramCanvas" width="800" height="400"></canvas>

<hr>
  
<h2 data-i18n="spectrograms"></h2>

<div class="spectrogram-container">

    <div class="spectrogram">
        <h3 data-i18n="original"></h3>
        <div class="spectrogram-canvas-wrapper">
            <canvas id="originalSpectrogram"></canvas>
            <div id="cursor-original" class="spectrogram-cursor"></div>
        </div>
    </div>

    <div class="spectrogram">
        <h3 data-i18n="hearingLoss"></h3>
        <div class="spectrogram-canvas-wrapper">
            <canvas id="lossSpectrogram"></canvas>
            <div id="cursor-processed" class="spectrogram-cursor"></div>
        </div>
    </div>

    <div class="spectrogram">
        <h3 data-i18n="difference"></h3>
        <div class="spectrogram-canvas-wrapper">
            <canvas id="differenceSpectrogram"></canvas>
            <div id="cursor-difference" class="spectrogram-cursor"></div>
        </div>
    </div>

    <div class="spectrogram-progress-wrapper">
        <div id="progress-container">
            <div id="progress-fill"></div>
        </div>
    </div>
  
</div>


  
<div id="playback-time">0:00 / 0:00</div>
  
<div id="status"></div>

<br>

<div id="audiogram"></div>

<button id="playButton" disabled>
Play
</button>

<button id="stopButton" disabled>
Stop
</button>


<button id="processButton">
Apply Hearing Loss
</button>


<script
type="module"
src="js/app.js">
</script>

</body>
</html>
