<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>
Hearing Loss Simulator
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<h1>
Hearing Loss Simulator
</h1>

<h2>Audio Source</h2>

<label>
<input
type="radio"
name="source"
value="sample"
checked>

Built-in sample
</label>

<select id="sampleSelect">

<option value="audio/male.wav">
Male Speech
</option>

<option value="audio/female.wav">
Female Speech
</option>

<option value="audio/restaurant.wav">
Restaurant
</option>

<option value="audio/music.wav">
Music
</option>

</select>

<br><br>

<label>
<input
type="radio"
name="source"
value="upload">

Upload WAV
</label>

<input
type="file"
id="audioFile"
accept=".wav">

<br><br>

<button id="loadButton">
Load Audio
</button>

<hr>

<div id="status">

No audio loaded.

</div>

<br>

<button
id="playButton"
disabled>

Play

</button>

<button
id="stopButton"
disabled>

Stop

</button>

<script
type="module"
src="js/app.js">
</script>

</body>

</html>
