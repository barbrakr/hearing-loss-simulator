<!DOCTYPE html>
<html lang="en">

<head>
  
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<script
    type="module"
    src="js/app.js">
</script>

  
<select id="language-select">
    <option value="en">English</option>
    <option value="de">Deutsch</option>
</select>

<title data-i18n="title">
Hearing Loss Simulator
</title>
  
<link
rel="stylesheet"
href="style.css">

</head>

<body>
  
<h1 data-i18n="title">
    Hearing Loss Simulator
</h1>
  
<h2 data-i18n="about">
    Introduction
</h2>






<p data-i18n="about_text1" data-i18n-html></p>
<p data-i18n="about_text2" data-i18n-html></p>
<p data-i18n="about_text3"></p>
<p>

</p>

<hr>
  
<h2>Audio Source</h2>

<label>
<input
type="radio"
name="source"
value="sample"
checked>

Built-in sample
</label>

<select id="sampleSelect">

<option value="audio/freesound_community-4-year-old-counting-to-10-94902.wav">
Boy (speech - English)
</option>

<option value="audio/faespencer-i-shouldnx27t-have-to-pick-up-my-toys-childspoken-204923.wav">
Girl (speech - English)
</option>

<option value="audio/freesound_community-what-is-it-like-to-be-a-crocodile-27706.wav">
Man (speech - English)
</option>

<option value="audio/Sunday_someday.wav">
Woman (speech - English)
</option>
  
<option value="audio/German_Examples.wav">
Woman (speech - German)
</option>
  
<option value="audio/quatschsaetze.wav">
Woman (speech - German nonsense)
</option>
  
<option value="audio/glasswater.wav">
Bottle and water
</option>

</select>

<br><br>

<label>
<input
type="radio"
name="source"
value="upload">

Upload WAV
</label>

<input
type="file"
id="audioFile"
accept=".wav">

<br><br>

<select id="noiseSelect">
<option value="fan">Fan</option>
<option value="music">Music</option>
<option value="restaurant">Restaurant chatter</option>
<option value="traffic">Distant traffic</option>

</select>

<button id="noiseButton">
Add background noise
</button>

  
<button id="loadButton">
Load Audio
</button>

<p>

</p>
  
<hr>

<h2>Interactive Audiogram</h2>

<div id="audiogram"></div>
<canvas id="audiogramCanvas" width="800" height="400"></canvas>

<hr>
  
<h2 data-i18n="spectrograms">
    Spectrograms
</h2>

<div class="spectrogram-container">

    <div class="spectrogram">
        <h3 data-i18n="original">
            Original
        </h3>
        <div class="spectrogram-canvas-wrapper">
            <canvas id="originalSpectrogram"></canvas>
            <div id="cursor-original" class="spectrogram-cursor"></div>
        </div>
    </div>

    <div class="spectrogram">
        <h3 data-i18n="hearingLoss">
            Hearing Loss
        </h3>
        <div class="spectrogram-canvas-wrapper">
            <canvas id="lossSpectrogram"></canvas>
            <div id="cursor-processed" class="spectrogram-cursor"></div>
        </div>
    </div>

    <div class="spectrogram">
        <h3 data-i18n="difference">
            Difference
        </h3>
        <div class="spectrogram-canvas-wrapper">
            <canvas id="differenceSpectrogram"></canvas>
            <div id="cursor-difference" class="spectrogram-cursor"></div>
        </div>
    </div>

    <div class="spectrogram-progress-wrapper">
        <div id="progress-container">
            <div id="progress-fill"></div>
        </div>
    </div>
  
</div>


  
<div id="playback-time">0:00 / 0:00</div>
  
<div id="status"></div>

<br>

<div id="audiogram"></div>

<button id="playButton" disabled>
Play
</button>

<button id="stopButton" disabled>
Stop
</button>


<button id="processButton">
Apply Hearing Loss
</button>


<script
type="module"
src="js/app.js">
</script>

</body>
</html>
